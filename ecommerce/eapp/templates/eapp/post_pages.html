{% extends "layout.html" %}

{% block title %}
    {{ post.title }}
{% endblock %}

{% block content %}


<section class="max-w-7xl mx-auto px-4 py-12">
    <article>
         <img class="rounded-md max-h-40 w-full object-cover" src="{{ post.banner.url }}" alt="{{ post.title }}">
       
        <h1 class="text-2xl md:text-3xl leading-[46px] font-semibold m ">
            {{ post.title }}
        </h1>
        <p class="text-sm text-gray-500">{{ post.date }}</p>
        <p class="text-sm text-gray-500">{{ post.time }}</p>
        <div class="mt-6 prose">
            {{ post.body|safe }}
        </div>
    </article>
</section>

{% endblock %}
